events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream services inside Docker network
    upstream wp_backend {
        server wordpress:80;
    }

    upstream pma_backend {
        server phpmyadmin:80;
    }

    # Redirect HTTP (port 80) to HTTPS (port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # HTTPS (port 443) Server Block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # SSL Certificates
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Reverse Proxy to phpMyAdmin (/phpmyadmin)
        location /phpmyadmin/ {
            proxy_pass http://pma_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Convenience redirect for /phpmyadmin without trailing slash
        location = /phpmyadmin {
            return 301 https://$host/phpmyadmin/;
        }

        # Reverse Proxy to WordPress (root /)
        location / {
            proxy_pass http://wp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
