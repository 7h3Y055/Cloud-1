---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install fundamental system packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present

- name: Configure UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny

- name: Configure UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH port 22
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow HTTP port 80
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS port 443
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled
