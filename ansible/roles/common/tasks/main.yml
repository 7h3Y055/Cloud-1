---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install fundamental system packages
  apt:
    name:
      - curl
      - ufw
      - ca-certificates
    state: present

- name: Configure UFW default incoming policy to deny
  ufw:
    direction: incoming
    default: deny

- name: Configure UFW default outgoing policy to allow
  ufw:
    direction: outgoing
    default: allow

- name: Allow SSH port 22
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow HTTP port 80
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS port 443
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW firewall
  ufw:
    state: enabled
