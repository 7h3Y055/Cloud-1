---
- name: Install Docker and Docker Compose from Ubuntu repositories
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes

- name: Ensure Docker service is enabled and running
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add user to docker group
  user:
    name: "{{ ansible_user | default('ubuntu') }}"
    groups: docker
    append: yes
